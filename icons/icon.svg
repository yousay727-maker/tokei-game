<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="190" fill="#FFFFFF" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="175" fill="#FFFDF8" stroke="#4ECDC4" stroke-width="8" />
  
  <!-- Clock ticks -->
  <circle cx="256" cy="95" r="7" fill="#FF6B6B" />
  <circle cx="417" cy="256" r="7" fill="#4D96FF" />
  <circle cx="256" cy="417" r="7" fill="#FF6B6B" />
  <circle cx="95" cy="256" r="7" fill="#4D96FF" />

  <!-- Cute Face Eyes -->
  <ellipse cx="215" cy="210" rx="10" ry="14" fill="#2B2D42" />
  <ellipse cx="297" cy="210" rx="10" ry="14" fill="#2B2D42" />
  <circle cx="219" cy="206" r="4" fill="#FFFFFF" />
  <circle cx="301" cy="206" r="4" fill="#FFFFFF" />
  
  <!-- Cheeks -->
  <ellipse cx="195" cy="230" rx="14" ry="9" fill="#FF8A8A" opacity="0.6" />
  <ellipse cx="317" cy="230" rx="14" ry="9" fill="#FF8A8A" opacity="0.6" />

  <!-- Smile -->
  <path d="M 235 240 Q 256 260 277 240" fill="none" stroke="#2B2D42" stroke-width="5" stroke-linecap="round" />

  <!-- Hour Hand (Red, pointing to 3) -->
  <line x1="256" y1="256" x2="345" y2="256" stroke="#FF5964" stroke-width="18" stroke-linecap="round" />
  
  <!-- Minute Hand (Blue, pointing to 12) -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="#35A7FF" stroke-width="12" stroke-linecap="round" />

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="16" fill="#FFE74C" stroke="#2B2D42" stroke-width="4" />
</svg>
