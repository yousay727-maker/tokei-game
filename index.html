<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>とけいマスター - 4さいからの とけいあそび</title>
  <meta name="description" content="4さいのお子さまが たのしく 時計のよみかたを まなべる ゲームあぷり">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF9F1C">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="logo-area">
        <span style="font-size: 1.8rem;">⏰</span>
        <h1 class="app-title">とけいマスター</h1>
      </div>
      <div class="header-controls">
        <button id="btn-sound-toggle" class="btn-icon" title="おとの きりかえ" aria-label="おとの きりかえ">
          🔊
        </button>
      </div>
    </header>

    <!-- モード切り替えタブ -->
    <nav class="mode-tabs">
      <button class="tab-btn active" data-mode="quiz">
        <span class="tab-icon">❓</span>
        <span>なんじかな？</span>
      </button>
      <button class="tab-btn" data-mode="match">
        <span class="tab-icon">🎯</span>
        <span>あわせよう！</span>
      </button>
      <button class="tab-btn" data-mode="free">
        <span class="tab-icon">🌈</span>
        <span>じゆうにあそぶ</span>
      </button>
    </nav>

    <!-- 針の色のガイド（赤＝じ、青＝ふん） -->
    <div class="hand-guide-bar">
      <div class="guide-item guide-hour">
        <span class="guide-color-dot"></span>
        <span>みじかいはり＝<b>「〜じ」</b></span>
      </div>
      <div class="guide-item guide-minute">
        <span class="guide-color-dot"></span>
        <span>ながいはり＝<b>「〜ふん」</b></span>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="main-content">

      <!-- ================= 1. なんじかな？クイズ ================= -->
      <section id="view-quiz" class="view-section active">
        <!-- 難易度切り替え -->
        <div class="difficulty-selector">
          <span class="diff-title">むずかしさ：</span>
          <button class="diff-btn active" data-diff="easy">かんたん（◯じ）</button>
          <button class="diff-btn" data-diff="normal">ふつう（◯じはん）</button>
        </div>

        <!-- お題カード -->
        <div class="question-card">
          <div class="question-text">
            <span>いま なんじかな？</span>
            <button id="btn-quiz-speak" class="speak-hint-btn" title="こえを きく">🔊</button>
          </div>
        </div>

        <!-- 時計表示（クイズ時は読み取り専用） -->
        <div class="clock-area">
          <div id="quiz-clock-container"></div>
        </div>

        <!-- 3択の選択肢 -->
        <div id="quiz-options-container" class="quiz-options">
          <!-- JSで動的にボタン生成 -->
        </div>
      </section>

      <!-- ================= 2. とけいをあわせよう！ ================= -->
      <section id="view-match" class="view-section">
        <!-- 難易度切り替え -->
        <div class="difficulty-selector">
          <span class="diff-title">むずかしさ：</span>
          <button class="diff-btn active" data-diff="easy">かんたん（◯じ）</button>
          <button class="diff-btn" data-diff="normal">ふつう（◯じはん）</button>
        </div>

        <!-- お題カード -->
        <div class="question-card">
          <div class="question-text" id="match-target-text">
            <!-- お題テキスト -->
          </div>
        </div>

        <!-- 時計表示（操作可能） -->
        <div class="clock-area">
          <div id="match-clock-container"></div>
        </div>

        <!-- 判定ボタン -->
        <div class="action-area">
          <button id="btn-match-check" class="big-btn btn-primary">
            <span>できたよ！</span>
            <span>✨</span>
          </button>
        </div>
      </section>

      <!-- ================= 3. じゆうにあそぶ（フリー探求） ================= -->
      <section id="view-free" class="view-section">
        <!-- 現在の時計の読み方デジタル表示 -->
        <div class="digital-time-bar">
          <span class="digital-hour" id="free-digital-hour">3</span>
          <span class="digital-colon">:</span>
          <span class="digital-minute" id="free-digital-min">00</span>
          <span class="digital-kana" id="free-digital-kana">（３じ）</span>
          <button id="btn-free-speak" class="speak-hint-btn" title="よんでみる">🔊</button>
        </div>

        <!-- 時計表示（自由に針をドラッグ） -->
        <div class="clock-area">
          <div id="free-clock-container"></div>
        </div>

        <!-- 生活シーン連動カード -->
        <div class="scene-display-card" id="free-scene-card">
          <div class="scene-icon-box" id="free-scene-icon"></div>
          <div class="scene-info">
            <span class="scene-badge" id="free-scene-badge">おやつの じかん</span>
            <div class="scene-title" id="free-scene-title">おやつ</div>
            <div class="scene-desc" id="free-scene-desc">3じ！ おいしい おやつを たべよう！</div>
          </div>
        </div>

        <!-- ワンタップで時間を変えてみるショートカット -->
        <div class="quick-time-grid">
          <button class="quick-btn" data-time="7:00">
            <span>🍳 7:00</span>
            <span>あさごはん</span>
          </button>
          <button class="quick-btn" data-time="12:00">
            <span>🍙 12:00</span>
            <span>おひる</span>
          </button>
          <button class="quick-btn" data-time="15:00">
            <span>🍰 3:00</span>
            <span>おやつ</span>
          </button>
          <button class="quick-btn" data-time="20:00">
            <span>🌙 8:00</span>
            <span>ねんね</span>
          </button>
        </div>
      </section>

    </main>
  </div>

  <!-- 正解モーダル・フィードバック -->
  <div id="feedback-modal" class="feedback-modal">
    <div class="feedback-content">
      <div class="feedback-icon" id="feedback-icon">🎉</div>
      <div class="feedback-title" id="feedback-title">せいかい！</div>
      <div class="feedback-message" id="feedback-message">すごいね！ だいせいかい！</div>
      <button id="btn-feedback-next" class="big-btn btn-success">
        <span>つぎへ！</span>
        <span>👉</span>
      </button>
    </div>
  </div>

  <!-- 紙吹雪用Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- スクリプト -->
  <script src="js/audio.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
